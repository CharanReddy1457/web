<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIT Puducherry | Network Operating Center</title>

    <link rel="stylesheet" href="wifi.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <!-- =========================
                 Header
            ========================== -->
            <header class="heading">

                <img
                    src="NIT_Puducherry_Official_logo.png"
                    alt="NIT Puducherry Logo"
                    class="logo"
                >

                <div class="header-text">
                    <h1>NIT PUDUCHERRY</h1>
                    <h2>NETWORK OPERATING CENTER</h2>
                </div>

            </header>


            <!-- =========================
                 Terms Notice
            ========================== -->
            <div class="note">

                <span>
                    Please read and accept our
                </span>

                <strong>
                    Terms and Conditions
                </strong>

            </div>


            <!-- =========================
                 Terms & Conditions
            ========================== -->
            <section class="terms-section">

                <textarea
                    name="Terms"
                    id="Terms"
                    class="terms"
                    readonly
                >Terms of Use

By accepting this agreement and accessing the wireless network, you acknowledge that you are of legal age, you have read and understood, and agree to be bound by this agreement.

(*) The wireless network service is provided by the property owners and is completely at their discretion. Your access to the network may be blocked, suspended, or terminated at any time for any reason.

(*) You agree not to use the wireless network for any purpose that is unlawful or otherwise prohibited and you are fully responsible for your use.

(*) The wireless network is provided "as is" without warranties of any kind, either expressed or implied.

This wireless network is powered by System Administrator, Network Operating Centre, NIT Puducherry.</textarea>

            </section>


            <!-- =========================
                 Terms Acceptance
            ========================== -->
            <label class="checkbox">

                <input
                    type="checkbox"
                    id="acceptTerms"
                    required
                >

                <span>
                    I have read and accept the Terms and Conditions
                </span>

            </label>


            <!-- =========================
                 Next Button
            ========================== -->
            <form action="login.html">

                <button
                    type="submit"
                    class="next"
                >

                    <span>Next</span>

                    <span class="arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- =========================
                 Footer
            ========================== -->
            <footer>

                <p>
                    © NIT Puducherry • Network Operating Center
                </p>

            </footer>

        </section>

    </main>

</body>

</html>
